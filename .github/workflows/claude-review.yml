name: Claude Code Review

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Supplying the workflow token bypasses the action's default GitHub
          # App OIDC exchange. That keeps this reusable workflow compatible
          # with long-lived caller branches that predate id-token: write while
          # retaining the least privileges required for review comments.
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
